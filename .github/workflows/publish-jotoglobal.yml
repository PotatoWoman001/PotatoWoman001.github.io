name: Publish jotoglobal to Aliyun
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jotoglobal-production
  cancel-in-progress: false
jobs:
  deploy-inquiry-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy staged inquiry routing and run restricted recipient test
        env:
          DEPLOY_KEY: ${{ secrets.JOTO_ALIYUN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/joto-aliyun
          chmod 0600 ~/.ssh/joto-aliyun
          printf '%s\n' '139.224.51.172 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILFbw8wchhE+in/D8Ne/6mmyfUj9h8McSsdQYjWjrfYx' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/joto-aliyun -o BatchMode=yes -o ConnectTimeout=15 root@139.224.51.172 'bash /tmp/joto-inquiry-distribution-20261016/deploy.sh'
