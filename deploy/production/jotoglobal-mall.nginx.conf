# Include this file inside the HTTPS jotoglobal.com server block after
# /etc/nginx/snippets/jotoglobal-security-headers.conf.

location = /api/contact {
    limit_except POST {
        deny all;
    }
    limit_req zone=jotoglobal_contact burst=8 nodelay;
    proxy_pass http://127.0.0.1:3004/api/contact;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

location = /mall-sitemap.xml {
    alias /var/www/jotoglobal/catalog-current/mall-sitemap.xml;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/jotoglobal-security-headers.conf;
}

location = /mall-data/manifest.json {
    alias /var/www/jotoglobal/catalog-current/manifest.json;
    limit_except GET {
        deny all;
    }
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/jotoglobal-security-headers.conf;
}

location ^~ /mall-data/media/ {
    alias /var/www/jotoglobal/catalog-current/media/;
    autoindex off;
    limit_except GET {
        deny all;
    }
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/jotoglobal-security-headers.conf;
    access_log off;
}

location ^~ /mall-data/ {
    alias /var/www/jotoglobal/catalog-current/;
    autoindex off;
    limit_except GET {
        deny all;
    }
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/jotoglobal-security-headers.conf;
}

location ~ ^/zh/mall/products/[^/]+/?$ {
    try_files $uri $uri/ /zh/mall/product/index.html;
}

location ~ ^/fa/mall/products/[^/]+/?$ {
    try_files $uri $uri/ /fa/mall/product/index.html;
}

location ~ ^/mall/products/[^/]+/?$ {
    try_files $uri $uri/ /mall/product/index.html;
}
